<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14142B" />
    <script>
      (() => {
        let theme = 'dark'
        try {
          const saved = window.localStorage.getItem('gmda-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch {
          // Use the default theme when storage is unavailable.
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#14142B' : '#F5F3EC')
      })()
    </script>
    <meta
      name="description"
      content="GMDA is an independent, local-first workspace for your team of AI agents. Organize agents, choose models, follow their work, and stay in control through approvals."
    />
    <meta property="og:title" content="GMDA — Your AI team. Your control." />
    <meta
      property="og:description"
      content="A local-first home for your team of AI agents."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/gmda-mark.png" />
    <title>GMDA — Your AI team. Your control.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
